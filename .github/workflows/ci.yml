name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check dist/engine.js
          node --check dist/app.js
      - name: Validate APD and AD against analytic examples
        run: node tests/validate-apd.cjs
      - name: Test offline packaging and local launcher
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build offline app
        run: python build_offline.py --output APD-Visualizer.html
      - name: Save validation report and offline app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apd-visualizer-${{ matrix.os }}
          path: |
            tests/validation-report.json
            APD-Visualizer.html
          if-no-files-found: error
